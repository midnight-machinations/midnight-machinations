name: sammyserver-deploy

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout code from prod branch
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check required voice secrets
        env:
          VOICE_CONTROL_SECRET: ${{ secrets.VOICE_CONTROL_SECRET }}
          VOICE_PUBLIC_URL: ${{ secrets.VOICE_PUBLIC_URL }}
          VOICE_ANNOUNCED_ADDRESS: ${{ secrets.VOICE_ANNOUNCED_ADDRESS }}
          VOICE_ALLOWED_ORIGINS: ${{ secrets.VOICE_ALLOWED_ORIGINS }}
        run: |
          missing=0
          for name in VOICE_CONTROL_SECRET VOICE_PUBLIC_URL VOICE_ANNOUNCED_ADDRESS VOICE_ALLOWED_ORIGINS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Repository Actions secret $name is empty or unavailable to this run."
              missing=1
            fi
          done
          exit "$missing"

      # 2. Log in to Docker Hub
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build & push server image
      - name: Build and push server image
        uses: docker/build-push-action@v4
        with:
          context: ./server
          file: ./server/dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/midnightmachinations-server:latest
          build-args: |
            WS_ADDRESS=0.0.0.0:80

      - name: Build and push voice image
        uses: docker/build-push-action@v4
        with:
          context: ./voice
          file: ./voice/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/midnightmachinations-voice:latest

      # Secrets are passed as environment variables, never interpolated into shell code.
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v0.1.6
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VOICE_CONTROL_SECRET: ${{ secrets.VOICE_CONTROL_SECRET }}
          VOICE_PUBLIC_URL: ${{ secrets.VOICE_PUBLIC_URL }}
          VOICE_ANNOUNCED_ADDRESS: ${{ secrets.VOICE_ANNOUNCED_ADDRESS }}
          VOICE_ALLOWED_ORIGINS: ${{ secrets.VOICE_ALLOWED_ORIGINS }}
        with:
          host: ${{ secrets.SERVER_HOST }}         # e.g., your.server.com or IP
          username: ${{ secrets.SERVER_USER }}     # SSH user
          key: ${{ secrets.SERVER_SSH_KEY }}       # SSH private key
          port: ${{ secrets.SERVER_SSH_PORT }}     # optional, defaults to 22
          envs: DOCKERHUB_USERNAME,VOICE_CONTROL_SECRET,VOICE_PUBLIC_URL,VOICE_ANNOUNCED_ADDRESS,VOICE_ALLOWED_ORIGINS
          command_timeout: 10m
          script: |
            set -eu
            : "${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in GitHub secrets}"
            : "${VOICE_CONTROL_SECRET:?Set VOICE_CONTROL_SECRET in GitHub secrets}"
            : "${VOICE_PUBLIC_URL:?Set VOICE_PUBLIC_URL in GitHub secrets}"
            : "${VOICE_ANNOUNCED_ADDRESS:?Set VOICE_ANNOUNCED_ADDRESS in GitHub secrets}"
            : "${VOICE_ALLOWED_ORIGINS:?Set VOICE_ALLOWED_ORIGINS in GitHub secrets}"

            # ssh-action v0.1.6 assigns shell variables without exporting them.
            # Docker's -e NAME reads the environment of the docker process.
            export VOICE_CONTROL_SECRET VOICE_PUBLIC_URL VOICE_ANNOUNCED_ADDRESS VOICE_ALLOWED_ORIGINS

            # Fetch both images before interrupting the running game.
            docker pull "$DOCKERHUB_USERNAME/midnightmachinations-server:latest"
            docker pull "$DOCKERHUB_USERNAME/midnightmachinations-voice:latest"
            docker network inspect midnightmachinations >/dev/null 2>&1 || docker network create midnightmachinations

            # Stop the game before replacing the voice service that enforces its policies.
            docker stop midnightmachinations-server || true
            docker rm midnightmachinations-server || true
            docker stop midnightmachinations-voice || true
            docker rm midnightmachinations-voice || true
            docker run -d --name midnightmachinations-voice \
              --restart unless-stopped \
              --network midnightmachinations \
              -p 9100:9100 \
              -p 44400-44402:44400-44402/udp \
              -p 44400-44402:44400-44402/tcp \
              -e VOICE_CONTROL_SECRET \
              -e VOICE_ANNOUNCED_ADDRESS \
              -e VOICE_ALLOWED_ORIGINS \
              -e VOICE_LISTEN_ADDRESS=0.0.0.0 \
              -e VOICE_CONTROL_ADDRESS=0.0.0.0 \
              -e VOICE_MEDIA_ADDRESS=0.0.0.0 \
              "$DOCKERHUB_USERNAME/midnightmachinations-voice:latest"

            docker run -d --name midnightmachinations-server \
              --restart unless-stopped \
              --network midnightmachinations \
              -p 2001:80 \
              -e VOICE_CONTROL_SECRET \
              -e VOICE_PUBLIC_URL \
              -e VOICE_CONTROL_URL=ws://midnightmachinations-voice:9101/control \
              "$DOCKERHUB_USERNAME/midnightmachinations-server:latest"

            # Readiness requires a live authenticated connection from the game server.
            for attempt in $(seq 1 30); do
              if docker exec midnightmachinations-voice node -e \
                'fetch("http://127.0.0.1:9100").then(r => r.text()).then(body => process.exit(body.trim() === "voice ready" ? 0 : 1)).catch(() => process.exit(1))'; then
                exit 0
              fi
              sleep 2
            done
            echo 'Voice did not become ready. Check docker logs for both containers.' >&2
            exit 1
