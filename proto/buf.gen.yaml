version: v2
clean: true
plugins:
  # TypeScript messages and a Twirp client for the browser. Rust is generated by
  # server/proto/build.rs with twurst-build, since Twirp has no buf plugin for Rust.
  - local: protoc-gen-ts
    out: ../client/src/gen
    opt:
      - ts_nocheck
      - eslint_disable
