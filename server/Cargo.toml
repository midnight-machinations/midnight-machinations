[package]
name = "mafia_server"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# aislop flags unwrap(), todo!(), and unimplemented!() in non-test code, and its quality
# limits (function length, parameter count, nesting) are the thresholds in /clippy.toml.
[lints.clippy]
unwrap_used = "warn"
todo = "warn"
unimplemented = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
excessive_nesting = "warn"

[dependencies]
# Only channels are needed by the game itself, which keeps it buildable for WebAssembly (see wasm/).
tokio = { version = "1", features = ["sync"] }
lazy_static = "1.4.0"
serde_json = "1.0"
serde = {version = "1.0.152",  features = ["derive"]}
rand = "0.9.0"
vec1 = { version = "1.12.1", features = ["serde"] }
enum_delegate = "0.2.0"

# The native server: TCP/WebSocket hosting, timers, the voice control link, and logging timestamps.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = ">=0.18.0"
futures-util = "0.3.31"
chrono = { version = "0.4.25", default-features = false, features = ["clock"] }
dotenv = "0.15"
